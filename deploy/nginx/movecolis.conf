# =========================================================
#  MoveColis — site Nginx (à côté de movecash.site, sans le modifier)
#  Installation (une fois, en root) : voir README, étape 4
#  Le HTTPS est ajouté ensuite par : certbot --nginx -d movecolis.com -d www.movecolis.com
# =========================================================

# Messagerie temps réel : passage en WebSocket (nom unique pour ne pas gêner les autres sites)
map $http_upgrade $movecolis_connection_upgrade {
    default upgrade;
    ''      close;
}

# www.movecolis.com → movecolis.com (une seule adresse : appli installée, notifications, connexion)
server {
    listen 80;
    server_name www.movecolis.com;
    # Redirection dans un "location" (et non au niveau du server) : Certbot peut ainsi valider www
    location / {
        return 301 https://movecolis.com$request_uri;
    }
}

server {
    listen 80;
    server_name movecolis.com;

    client_max_body_size 2m;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Socket.io (connexions longues)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $movecolis_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Site React
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
