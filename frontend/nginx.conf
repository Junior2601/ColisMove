# Site MoveColis (application React à une seule page). HTTPS et en-têtes de sécurité : Caddy, devant.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Fichiers générés par Vite (empreinte dans le nom) : ne changent jamais → cache d'un an
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Toujours la dernière version : service worker (notifications), manifeste PWA, page d'accueil
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Icônes et images : 7 jours
  location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Toute autre adresse (/voyage/12, /messages…) → index.html, React gère la page
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
