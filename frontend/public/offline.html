<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F26122" />
  <title>MoveColis — Hors ligne</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #222; }
    main { text-align: center; padding: 24px; max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 18px 0 6px; }
    p { color: #717171; font-size: 14.5px; line-height: 1.5; margin: 0 0 22px; }
    button { border: 0; border-radius: 10px; background: #F26122; color: #fff; font-weight: 700;
             font-size: 15px; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Pas de connexion</h1>
    <p>MoveColis a besoin d'Internet pour afficher les voyages et vos messages. Vérifiez votre connexion puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
